name: Rule regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate cards and starter decks
        run: |
          node scripts/import_premiere.mjs --check
          node scripts/import_premiere.mjs --edition a-new-hope --check
          node scripts/import_premiere.mjs --edition hoth --check
          node scripts/import_premiere.mjs --edition dagobah --check
          node scripts/import_premiere.mjs --edition cloud-city --check
          node scripts/import_premiere.mjs --edition jabbas-palace --check
          node scripts/import-collectors.mjs --check
          node scripts/build-deck-overview.mjs --check
      - name: Run all tests
        run: node --test
      - name: Install the pinned browser test dependency
        run: npm ci
      - name: Install Chromium for browser checks
        run: npx playwright-core install --with-deps chromium
      - name: Test the trainer and the production package in Chromium
        env:
          SWCCG_CHROMIUM_CHANNEL: chromium
        run: npm run test:browser
      - name: Build the static ALL-INKL and preview release
        run: node scripts/build-web.mjs --output "${{ runner.temp }}/pages"
      - name: Keep the tested release for SFTP deployment
        uses: actions/upload-artifact@v4
        with:
          name: all-inkl-web-release
          path: ${{ runner.temp }}/pages
          include-hidden-files: true
          retention-days: 14
      - name: Upload the GitHub Pages artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/')
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages
  deploy:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/')
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
